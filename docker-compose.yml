services:
  postgres:
    
    image: pgvector/pgvector:pg15
    container_name: learning-ai-postgres
    environment:
      POSTGRES_USER: learning_ai
      POSTGRES_PASSWORD: learning_ai_password
      POSTGRES_DB: learning_ai
    ports:
       - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: